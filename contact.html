<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT</title>
    <link rel="icon" type="image/jpeg" href="logo.png">
    <link rel="stylesheet" href="contact.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css'">
  <link rel="stylesheet" href="theme-overrides.css">
</head>
<body>

   

    <div class="contact-page">

        <div class="header-section">
            <div class="pulse-ring"></div>
            <h1 class="k1" id="contactHeading">CONTACT INFORMATION</h1>
        </div>

        <div class="info-grid">
            <div class="info-card" style="animation-delay: 0.1s">
                <div class="card-glow"></div>
                <div class="icon-wrap">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <h3 id="contactEmailLabel">Email</h3>
                <p id="contactEmail" >you@example.com</p>
            </div>

            <div class="info-card" style="animation-delay: 0.2s">
                <div class="card-glow"></div>
                <div class="icon-wrap">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <h3 id="contactPhoneLabel">Phone</h3>
                <p id="contactPhone">+1 000 000 0000</p>
            </div>

            <div class="info-card" style="animation-delay: 0.3s">
                <div class="card-glow"></div>
                <div class="icon-wrap">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <h3 id="contactLocationLabel">Location</h3>
                <p id="contactLocation">Your City<br>Your Country</p>
            </div>
        </div>
        
        <div class="mail-btn">
    <a href="contactus.html" class="s2"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> <span id="contactSendMailButton">SEND MAIL</span></a>
</div><br><br>

        <div class="map-section">
            <div class="map-header">
                <span id="contactMapTitle">FIND ME HERE</span>
            </div>
            <div class="map-wrapper">
                <iframe id="contactMapFrame"
                    src=""
                    width="100%"
                    height="100%"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <div class="map-overlay-tag">
                    <i class="fa-solid fa-location-dot"></i> <span id="contactMapTag">Your Location</span>
                </div>
            </div>
        </div>


        <div class="back-btn">
            <a href="index.html" class="s2"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span id="contactBackButton">BACK TO HOME</span></a>
        </div>

    </div>
     <div class="particles" id="particles"></div>

    <script src="page-transition.js"></script>
  <script src="icon-fallback.js"></script>
<script src="portfolio-data.js"></script>
    <script src="portfolio-render.js"></script>
    <script>
const cards = document.querySelectorAll('.info-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        cards.forEach(card => observer.observe(card));
    </script>
</body>
</html>
